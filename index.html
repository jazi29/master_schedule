<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#8a8f9a;--line:#e6e8ec;--acc:#7c4dff;--accsoft:#efe9ff;--ok:#27a567;
box-sizing:border-box}
html{background:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--card:#171a21;--ink:#f1f3f7;--mute:#7c8291;--line:#262a33;--acc:#a78bfa;--accsoft:#272040;--ok:#4cc88a}}
:root[data-theme="dark"]{--bg:#0e1014;--card:#171a21;--ink:#f1f3f7;--mute:#7c8291;--line:#262a33;--acc:#a78bfa;--accsoft:#272040;--ok:#4cc88a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) 18px 40px}
.date{color:var(--mute);font-size:14px;font-weight:500}
h1{margin:2px 0 0;font-size:30px;letter-spacing:-.03em;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
h1 small{font-size:15px;font-weight:500;color:var(--mute);letter-spacing:0;font-variant-numeric:tabular-nums}
.now{background:var(--ink);color:var(--bg);border-radius:24px;padding:20px;margin:18px 0 16px}
.now .t{font-size:13px;opacity:.65;margin-bottom:6px}
.now .n{font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.25}
.now .m{font-size:14px;opacity:.7;margin-top:6px}
.bar{height:6px;background:rgba(127,127,127,.28);border-radius:9px;overflow:hidden;margin-top:16px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
.now .bar i{background:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .now{background:#232838;color:#f1f3f7}}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;border:0;background:transparent;color:var(--mute);font:600 14px inherit;font-family:inherit;padding:9px 0 7px;border-radius:14px;cursor:pointer;position:relative}
.tab span{display:block;font-size:11px;font-weight:500;margin-top:1px;opacity:.8}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.tab.today::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:9px;background:var(--acc)}
.sum{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:0 4px 8px;font-variant-numeric:tabular-nums}
.list{background:var(--card);border-radius:22px;overflow:hidden}
.row{display:grid;grid-template-columns:54px 1fr auto;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border:0}
.time{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.35}
.time b{display:block;color:var(--mute);font-weight:500}
.nm{font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.tc{font-size:13px;color:var(--mute);margin-top:3px}
.rm{font-size:13px;font-weight:600;background:var(--accsoft);color:var(--acc);padding:4px 9px;border-radius:9px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:6px;vertical-align:1px}
.row.done{opacity:.45}
.row.cur{background:var(--accsoft)}
.row.cur .bar{margin-top:10px;height:4px}
.empty{padding:36px 20px;text-align:center;color:var(--mute)}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:22px}
.foot button{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;cursor:pointer}
.wrap{padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 18px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:5}
.nav button{flex:1;max-width:220px;border:0;background:transparent;color:var(--mute);font:600 14px inherit;font-family:inherit;padding:10px 0;border-radius:14px;cursor:pointer}
.nav button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.add{background:var(--card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.add input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:0;border-radius:12px;padding:12px 14px;width:100%;outline:none;min-width:0}
.add input:focus-visible{box-shadow:0 0 0 2px var(--acc)}
.add .r{display:flex;gap:10px}
.add .go{flex:none;border:0;background:var(--acc);color:#fff;font:600 15px inherit;font-family:inherit;border-radius:12px;padding:0 18px;cursor:pointer}
.tk{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.tk:last-child{border:0}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;color:#fff;font-size:14px;line-height:1}
.tk.dn .ck{background:var(--ok);border-color:var(--ok)}
.tk .tx{font-size:15px;font-weight:550;line-height:1.3;word-break:break-word}
.tk.dn .tx{text-decoration:line-through;color:var(--mute)}
.tk .dd{font-size:12px;color:var(--mute);margin-top:2px}
.tk .dd.late{color:#e5484d;font-weight:600}
.x{border:0;background:transparent;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 6px;line-height:1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes grow{from{width:0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,200,138,.7)}100%{box-shadow:0 0 0 9px rgba(76,200,138,0)}}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.row{box-shadow:inset 3px 0 0 var(--c,transparent)}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4cc88a;margin-right:8px;animation:pulse 1.6s infinite}
.tab{transition:background .25s,color .25s,transform .15s}
.tab:active,.nav button:active{transform:scale(.94)}
.tab.today::after{display:none}
.tab.today span{color:var(--acc);font-weight:700;opacity:1}
.tab u{display:block;height:3px;border-radius:3px;margin:6px 12px 0;text-decoration:none;background:linear-gradient(90deg,var(--acc) var(--p),var(--line) var(--p))}
#vs.an .now{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
#vs.an .row{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*70ms + 120ms)}
#vs.an .bar i{animation:grow 1.1s cubic-bezier(.2,.7,.2,1) .3s both}
#vt:not([hidden]){animation:rise .45s cubic-bezier(.2,.7,.2,1)}
.tk.fl{animation:rise .4s cubic-bezier(.2,.7,.2,1)}
.tk.dn.fl .ck{animation:pop .45s}
.ck{transition:background .2s,border-color .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nav .ph{flex:none;width:58px;max-width:none;display:grid;place-items:center;padding:0}
.nav .ph svg{width:22px;height:22px}
#ph{position:fixed;inset:0;z-index:20;background:rgba(8,9,12,.94);display:flex;flex-direction:column;animation:fade .3s ease}
#ph[hidden]{display:none}
@keyframes fade{from{opacity:0}}
#ph .top{display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 18px 10px;color:#f1f3f7;font-weight:600;font-size:15px}
#ph .top button{border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer}
#ph .box{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 12px calc(16px + env(safe-area-inset-bottom,0px))}
#ph img{display:block;width:100%;max-width:640px;margin:0 auto;border-radius:12px;background:#fff;cursor:zoom-in;transition:width .35s cubic-bezier(.2,.7,.2,1);animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
#ph img.z{width:230%;max-width:none;margin:0;cursor:zoom-out}
#ph .hint{text-align:center;color:#7c8291;font-size:12px;padding:8px 0 0}
/* splash */
#splash{display:none;position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,var(--acc),color-mix(in srgb,var(--acc) 62%,#000));display:grid;place-items:center;color:#fff;animation:splashout .5s ease 1.6s forwards}
@keyframes splashout{to{opacity:0;transform:scale(1.05);visibility:hidden}}
.sp{text-align:center}
.sp svg{width:104px;height:104px;animation:spin-in .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes spin-in{from{opacity:0;transform:scale(.4) rotate(-14deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
.sp .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease forwards}
.sp .l1{animation-delay:.55s}.sp .l2{animation-delay:.75s}.sp .l3{animation-delay:.95s}
.spt{font-size:28px;font-weight:700;margin-top:20px;letter-spacing:-.02em;animation:rise .6s .3s both cubic-bezier(.2,.7,.2,1)}
.spg{opacity:.75;margin-top:4px;font-size:14px;animation:rise .6s .45s both cubic-bezier(.2,.7,.2,1)}
/* toast */
#toast{white-space:pre-line;position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;font-size:14px;font-weight:600;z-index:40;max-width:min(92vw,440px);text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.25);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#toast.on{transform:translate(-50%,0)}
/* compact progress card */
.now{border-radius:20px;padding:13px 16px;margin:12px 0 12px}
.now .t{font-size:12px;margin-bottom:3px}
.now .n{font-size:17px;line-height:1.25}
.now .m{font-size:13px;margin-top:3px}
.now .bar{margin-top:10px;height:5px}
/* larger adaptive bottom bar and day tabs */
.nav{gap:0;padding:0;background:var(--bg)}
.nav button{font-size:clamp(15px,4.4vw,17px);max-width:none;min-height:46px;padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px)*.35);border-radius:0;box-shadow:none}
.nav .ph{width:clamp(56px,16vw,64px);padding:10px 0 calc(6px + env(safe-area-inset-bottom,0px)*.35)}
.nav .ph svg{width:24px;height:24px}
.tab{font-size:clamp(14px,4vw,16px)}
.tab span{font-size:clamp(12px,3.3vw,13px)}

function save(){try{localStorage.setItem("tasks",JSON.stringify(T))}catch(e){}}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function renderT(){
  var td=ymd(new Date()),dn=T.filter(function(t){return t.d}).length,n=T.length;
  $("tnow").innerHTML='<div class="t">Task progress</div><div class="n">'+(n?(dn+" of "+n+" done"):"No tasks yet")+'</div><div class="bar"><i style="width:'+(n?Math.round(dn/n*100):0)+'%"></i></div>';
  var s=T.slice().sort(function(a,b){if(a.d!==b.d)return a.d?1:-1;if(a.w&&b.w)return a.w<b.w?-1:1;if(a.w)return -1;if(b.w)return 1;return a.id-b.id});
  if(!s.length){$("tl").innerHTML='<div class="empty">Add your first task above</div>';return}
  $("tl").innerHTML=s.map(function(t){
    var late=t.w&&!t.d&&t.w<td,a=t.w?t.w.split("-"):0;
    return '<div class="tk'+(t.d?' dn':'')+(t.id===lastId?' fl':'')+'"><button class="ck" data-c="'+t.id+'" aria-label="Mark done">'+(t.d?'✓':'')+'</button><div><div class="tx">'+esc(t.x)+'</div>'+(t.w?'<div class="dd'+(late?' late':'')+'">'+(late?'Overdue · ':'Due ')+MON[+a[1]-1]+' '+(+a[2])+'</div>':'')+'</div><button class="x" data-x="'+t.id+'" aria-label="Delete">×</button></div>';
  }).join("");lastId=null;
}
var lastId=null;
function addT(){var v=$("ti").value.trim();if(!v)return;var nid=Date.now();lastId=nid;T.push({id:nid,x:v,w:$("td").value,d:false});$("ti").value="";$("td").value="";save();renderT()}
$("tgo").addEventListener("click",addT);
$("ti").addEventListener("keydown",function(e){if(e.key==="Enter")addT()});
$("tl").addEventListener("click",function(e){
  var c=e.target.closest("[data-c]"),x=e.target.closest("[data-x]");
  if(c){T.forEach(function(t){if(t.id==c.dataset.c){t.d=!t.d;lastId=t.id}});if(T.length&&T.every(function(t){return t.d}))setTimeout(function(){burst(document.querySelector(".tk.fl .ck"))},60)}
  else if(x){T=T.filter(function(t){return t.id!=x.dataset.x})}
  else return;
  save();renderT();
});
function view(v){var s=v===1;$("vs").hidden=!s;$("vt").hidden=s;$("nv1").className=s?"on":"";$("nv2").className=s?"":"on";$("ttl").textContent=s?"Schedule":"Tasks";if(s){animNext=true;render()}else renderT();window.scrollTo(0,0)}
$("nv1").addEventListener("click",function(){view(1)});
$("nv2").addEventListener("click",function(){view(2)});
var animNext=true,C={};C[P]=215;C[F]=270;C[G]=345;C[M]=160;C[S]=30;C[I]=195;
function frac(d,cur,td,wd){if(td===0)return wd===6?1:0;if(d<td)return 1;if(d>td)return 0;var tot=0,dn=0;D[d].forEach(function(x){var s=mins(x.s),e=mins(x.e);tot+=e-s;dn+=Math.max(0,Math.min(cur,e)-s)});return dn/tot}
function burst(el){if(!el||matchMedia("(prefers-reduced-motion:reduce)").matches)return;var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=[ACC,"#27a567","#f5a524","#e5484d","#a259ff"];
  for(var i=0;i<24;i++){var p=document.createElement("i");p.style.cssText="position:fixed;z-index:9;pointer-events:none;width:7px;height:7px;border-radius:2px;left:"+cx+"px;top:"+cy+"px;background:"+cols[i%5];document.body.appendChild(p);var a=Math.random()*6.28,d=60+Math.random()*100;
  p.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+(Math.sin(a)*d+50)+"px) rotate("+Math.random()*540+"deg) scale(.4)",opacity:0}],{duration:800+Math.random()*400,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=(function(q){return function(){q.remove()}})(p)}}
function phOpen(o){$("ph").hidden=!o;document.body.style.overflow=o?"hidden":"";if(!o)$("pi").classList.remove("z")}
$("nv3").addEventListener("click",function(){phOpen(true)});
$("phx").addEventListener("click",function(){phOpen(false)});
$("pi").addEventListener("click",function(){this.classList.toggle("z")});
document.addEventListener("keydown",function(e){if(e.key==="Escape")phOpen(false)});
animNext=false;render();setInterval(render,20000);
// toast + notifications (automatic, 5 min before class)
var tt=null;
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("on")},5000)}
$("toast").addEventListener("click",function(){this.classList.remove("on")});
var fired={};try{fired=JSON.parse(localStorage.getItem("fired")||"{}")}catch(e){}
function askPerm(){if(typeof Notification!=="undefined"&&Notification.permission==="default"){try{var r=Notification.requestPermission();if(r&&r.then)r.catch(function(){})}catch(e){}}}
askPerm();
document.addEventListener("click",function once(){askPerm();document.removeEventListener("click",once)});
function fire(x,diff){
  var title="Next class in "+diff+" min",body=x.n+" · "+x.s+" · "+x.r;
  if(typeof Notification!=="undefined"&&Notification.permission==="granted"){
    try{new Notification(title,{body:body,icon:makeIcon(180),tag:"cls-"+x.s})}catch(e){}
  }
  if(navigator.vibrate)try{navigator.vibrate([120,60,120])}catch(e){}
  toast(title+"\n"+body)}
function check(){
  if(!ST.on)return;var td=today();if(!td)return;
  var now=new Date(),cur=now.getHours()*60+now.getMinutes()+now.getSeconds()/60,key=ymd(now),ls=D[td],ch=false;
  for(var k in fired)if(k.indexOf(key)!==0){delete fired[k];ch=true}
  for(var i=0;i<ls.length;i++){var x=ls[i],diff=mins(x.s)-cur,id=key+x.s;
    if(diff>0&&diff<=ST.lead&&!fired[id]){
      var pv=ls[i-1];
      fired[id]=1;ch=true;
      if(pv&&pv.n===x.n&&pv.r===x.r&&mins(x.s)-mins(pv.e)<=20)continue;
      fire(x,Math.ceil(diff))}}
  if(ch)try{localStorage.setItem("fired",JSON.stringify(fired))}catch(e){}}
check();setInterval(check,15000);
document.addEventListener("visibilitychange",function(){if(!document.hidden){check();render()}});
// splash
(function(){var sp=$("splash");if(sp)sp.remove();animNext=true;render()})();
// offline cache (works when the page is hosted next to sw.js over https)
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}}
</script>
